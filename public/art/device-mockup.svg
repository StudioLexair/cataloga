  <!-- teléfono -->
  <g filter="url(#shadow-s)">
    <rect x="430" y="120" width="170" height="330" rx="28" fill="#1A1410"/>
    <rect x="438" y="128" width="154" height="314" rx="22" fill="#FBF7F1"/>
