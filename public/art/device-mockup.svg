<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B0805" flood-opacity="0.45"/>
    </filter>
    <filter id="shadow-s" x="-30%" y="-20%" width="170%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0B0805" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- laptop -->
  <g filter="url(#shadow)">
    <rect x="60" y="40" width="470" height="300" rx="18" fill="#231B15"/>
    <rect x="72" y="52" width="446" height="264" rx="10" fill="#FBF7F1"/>
    <!-- barra superior -->
    <rect x="72" y="52" width="446" height="34" fill="#F4EDE4"/>
    <circle cx="90" cy="69" r="4" fill="#E9B7A4"/>
    <circle cx="104" cy="69" r="4" fill="#D4B583"/>
    <circle cx="118" cy="69" r="4" fill="#B8C2AC"/>
    <rect x="380" y="61" width="60" height="16" rx="8" fill="#1A1410"/>
    <rect x="448" y="61" width="56" height="16" rx="8" fill="#C75D3B"/>
    <!-- sidebar -->
    <rect x="72" y="86" width="96" height="230" fill="#F7F1E8"/>
    <rect x="86" y="104" width="68" height="22" rx="11" fill="#1A1410"/>
    <rect x="86" y="136" width="58" height="10" rx="5" fill="#E4D7C3"/>
    <rect x="86" y="156" width="64" height="10" rx="5" fill="#E4D7C3"/>
