    <rect x="188" y="100" width="180" height="18" rx="9" fill="#1A1410"/>
    <rect x="188" y="128" width="240" height="9" rx="4.5" fill="#E4D7C3"/>
    <!-- grid de productos -->
    <g>
      <rect x="188" y="152" width="96" height="88" rx="10" fill="#F6E7DE"/>
      <rect x="212" y="172" width="48" height="34" rx="8" fill="#C75D3B"/>
      <rect x="200" y="250" width="56" height="8" rx="4" fill="#1A1410"/>
      <rect x="200" y="264" width="36" height="8" rx="4" fill="#D9C8AE"/>

      <rect x="296" y="152" width="96" height="88" rx="10" fill="#EDEFE7"/>
      <rect x="318" y="176" width="52" height="30" rx="8" fill="#4F5D46"/>
      <rect x="308" y="250" width="56" height="8" rx="4" fill="#1A1410"/>
      <rect x="308" y="264" width="36" height="8" rx="4" fill="#D9C8AE"/>

      <rect x="404" y="152" width="96" height="88" rx="10" fill="#F7EDDC"/>
      <rect x="428" y="170" width="48" height="36" rx="18" fill="#B08D55"/>
      <rect x="416" y="250" width="56" height="8" rx="4" fill="#1A1410"/>
      <rect x="416" y="264" width="36" height="8" rx="4" fill="#D9C8AE"/>
