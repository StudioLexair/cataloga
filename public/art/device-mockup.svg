    <rect x="448" y="156" width="134" height="118" rx="12" fill="#F4EDE4"/>
    <circle cx="515" cy="210" r="30" fill="#E9B7A4"/>
    <path d="M492 236c4-12 12-18 23-18s19 6 23 18" stroke="#C75D3B" stroke-width="5" stroke-linecap="round"/>
    <rect x="448" y="286" width="90" height="12" rx="6" fill="#1A1410"/>
    <rect x="448" y="306" width="120" height="8" rx="4" fill="#E4D7C3"/>
