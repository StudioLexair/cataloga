    <rect x="448" y="356" width="134" height="52" rx="10" fill="#F6E7DE"/>
    <rect x="458" y="366" width="32" height="32" rx="8" fill="#C75D3B"/>
    <rect x="498" y="370" width="54" height="8" rx="4" fill="#1A1410"/>
