  <!-- destellos -->
  <g fill="#B08D55">
    <path d="M52 96l4 10 10 4-10 4-4 10-4-10-10-4 10-4 4-10z"/>
    <path d="M612 76l3 8 8 3-8 3-3 8-3-8-8-3 8-3 3-8z"/>
